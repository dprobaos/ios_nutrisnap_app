# ================================================================
#  codemagic.yaml — Build iOS do NutriSnap SEM MAC LOCAL.
#  O Codemagic gera o projeto Xcode via XcodeGen (project.yml) e
#  builda → TestFlight. Você nunca precisa abrir o Xcode.
#
#  IMPORTANTE: conecte a pasta `ios_nutrisnap_app/` como raiz do
#  repositório, para que este codemagic.yaml fique na raiz.
#
#  PRÉ-REQUISITOS no Codemagic (uma vez):
#   - Repositório conectado (raiz = ios_nutrisnap_app/).
#   - Integração "App Store Connect" (a mesma dos outros apps: "NeuroVoice ASC").
#   - Um app criado no App Store Connect com bundle com.dprobaos.nutrisnap.
#   - Grupo de variáveis "ios_signing" com CM_CERTIFICATE_PRIVATE_KEY (reuso).
# ================================================================
workflows:
  ios-nutrisnap:
    name: NutriSnap iOS (TestFlight)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "NeuroVoice ASC"
    environment:
      groups:
        - ios_signing          # contém CM_CERTIFICATE_PRIVATE_KEY (secured)
      xcode: latest
      vars:
        XCODE_PROJECT: "NutriSnapApp.xcodeproj"
        XCODE_SCHEME: "NutriSnapApp"
        BUNDLE_ID: "com.dprobaos.nutrisnap"
    scripts:
      - name: Gerar o projeto Xcode (XcodeGen)
        script: |
          brew install xcodegen 2>/dev/null || true
          BN="${BUILD_NUMBER:-$(date +%s)}"
          echo "Build number: $BN"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BN\"/" project.yml || true
          xcodegen generate
      - name: Assinatura automática (App Store Connect)
        script: |
          set -e
          keychain initialize
          echo "===== FETCH APP (com.dprobaos.nutrisnap) ====="
          app-store-connect fetch-signing-files "com.dprobaos.nutrisnap" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CM_CERTIFICATE_PRIVATE_KEY \
            --create
          echo "===== ADD CERTIFICATES ====="
          keychain add-certificates
          echo "===== USE PROFILES ====="
          xcode-project use-profiles --verbose
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Só faz upload (build disponível p/ teste INTERNO sem revisão).
        # Para teste EXTERNO, preencha as "Test Information" no App Store
        # Connect e mude para true.
        submit_to_testflight: false
